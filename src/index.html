<!DOCTYPE html>
<html>
    <head>
        <title>SuperSplat</title>
        <meta charset="utf-8" />
        <link rel="manifest" href="./manifest.json">
        <link rel="stylesheet" href="./index.css">
        <link rel="shortcut icon" href="#">
        <meta name="description" content="SuperSplat is an advanced browser-based editor for manipulating and optimizing 3D Gaussian Splats. It is open source and engine agnostic." />
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    </head>

    <body>
        <script>
            // 初始化 window 配置结构（在模块脚本加载前执行）
            if (!window.__SUPERSPLAT_CONFIG__) window.__SUPERSPLAT_CONFIG__ = {};
            const c = window.__SUPERSPLAT_CONFIG__;
            if (!c.upload) c.upload = {};
            if (!c.api) c.api = {};
            if (!c.aws) c.aws = {};
            // 非本地环境自动使用相对路径（兜底逻辑）
            // localhost 和 IP 地址访问均视为本地开发环境，保留默认 apiHost
            if (!c.api.apiHost && window.location.hostname !== 'localhost' && !/^\d+\.\d+\.\d+\.\d+$/.test(window.location.hostname)) {
                c.api.apiHost = '';
            }
        </script>
        <script type="module" src="./index.js"></script>
    </body>
</html>
